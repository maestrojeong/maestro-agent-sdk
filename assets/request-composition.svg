<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">How a maestro-agent-sdk request is composed, in order</title>
  <desc id="desc">Example message sequence sent to the model provider. The system prompt is sent unchanged on every call. The first user message carries the prompt, the per-turn system-reminder (frozen into saved history), and ephemeral system-instructions carrying the deferred-tool catalog (never saved, only on this invocation's first message). After the model activates a tool with ToolSearch, later turns carry only the tool result and a fresh reminder, without the ephemeral note.</desc>

  <rect width="1200" height="980" rx="20" fill="#fbfaf6"/>
  <rect x="1" y="1" width="1198" height="978" rx="19" fill="none" stroke="#ded2b0" stroke-width="2"/>

  <text x="64" y="64" fill="#b4790a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">UNDER THE HOOD</text>
  <text x="64" y="98" fill="#221f18" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="750">What actually goes out on the wire</text>
  <rect x="64" y="114" width="46" height="3" fill="#b4790a"/>
  <text x="64" y="146" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">An example call sequence, in the order the provider receives it. The reminder is frozen into</text>
  <text x="64" y="166" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">saved history every turn; the ephemeral note never is, and only rides the first message below.</text>

  <!-- legend -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">
    <rect x="64" y="184" width="14" height="14" rx="3" fill="#f4e6c8" stroke="#b4790a"/>
    <text x="84" y="195" fill="#4b4433">frozen into saved history every turn</text>
    <rect x="330" y="184" width="14" height="14" rx="3" fill="#dbe9e1" stroke="#2b6b4f"/>
    <text x="350" y="195" fill="#4b4433">ephemeral: wire-only, never saved</text>
  </g>

  <!-- Row 1: system -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <circle cx="80" cy="240" r="14" fill="#221f18"/>
    <text x="80" y="245" fill="#fbfaf6" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <rect x="104" y="216" width="1032" height="64" rx="10" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
    <rect x="120" y="230" width="66" height="20" rx="5" fill="#3d5a80"/>
    <text x="153" y="244" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">SYSTEM</text>
    <text x="196" y="245" fill="#4b4433" font-size="13">"You are a coding assistant. [+ effort persona] [+ image-handling note]"</text>
    <text x="196" y="266" fill="#7a715c" font-size="11.5" font-style="italic">identical on every call in this session, ideal for the provider's prompt cache</text>
  </g>

  <!-- Row 2: user, first turn (anchor) -->
  <g>
    <circle cx="80" cy="430" r="14" fill="#221f18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"/>
    <text x="80" y="435" fill="#fbfaf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <rect x="104" y="300" width="1032" height="260" rx="10" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
    <rect x="120" y="314" width="52" height="20" rx="5" fill="#9c7a1a"/>
    <text x="146" y="328" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" text-anchor="middle">USER</text>
    <text x="188" y="328" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-style="italic">this invocation's first message (the "anchor")</text>

    <text x="120" y="356" fill="#221f18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">"Refactor the auth module to use JWT."</text>

    <!-- frozen reminder sub-block -->
    <rect x="120" y="370" width="1000" height="46" rx="8" fill="#f4e6c8" stroke="#b4790a" stroke-width="1.5"/>
    <text x="136" y="392" fill="#8a5a0a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">&lt;system-reminder&gt;</text>
    <rect x="990" y="379" width="118" height="20" rx="5" fill="#b4790a"/>
    <text x="1049" y="393" fill="#fffdf7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing=".3">FROZEN EVERY TURN</text>
    <text x="136" y="410" fill="#4b4433" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Tool iterations remaining: 20/20</text>

    <!-- ephemeral system-instructions sub-block: given real breathing room -->
    <rect x="120" y="428" width="1000" height="120" rx="8" fill="#dbe9e1" stroke="#2b6b4f" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="136" y="450" fill="#1e5a41" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">&lt;system-instructions&gt;</text>
    <rect x="990" y="439" width="118" height="20" rx="5" fill="#2b6b4f"/>
    <text x="1049" y="453" fill="#fbfaf6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing=".3">EPHEMERAL</text>
    <text x="136" y="474" fill="#4b4433" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Deferred tools (42):</text>
    <text x="152" y="494" fill="#4b4433" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">mcp__github__create_pr, mcp__slack__post, mcp__linear__create_issue, ...</text>
    <text x="136" y="516" fill="#4b4433" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Call ToolSearch("select:name") to activate.</text>
    <text x="136" y="538" fill="#1e5a41" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-style="italic">snapshotted once per invocation, never written to saved history, only ever on this message</text>
  </g>

  <!-- Row 3: assistant, ToolSearch -->
  <g>
    <circle cx="80" cy="594" r="14" fill="#221f18"/>
    <text x="80" y="599" fill="#fbfaf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <rect x="104" y="574" width="1032" height="64" rx="10" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
    <rect x="120" y="588" width="90" height="20" rx="5" fill="#3d7a56"/>
    <text x="165" y="602" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" text-anchor="middle">ASSISTANT</text>
    <text x="222" y="603" fill="#4b4433" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">tool_use: ToolSearch({ query: "select:mcp__github__create_pr" })</text>
    <text x="222" y="624" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-style="italic">the model picks a name straight out of the deferred-tools note above</text>
  </g>

  <!-- Row 4: user, tool result + reminder (no ephemeral) -->
  <g>
    <circle cx="80" cy="702" r="14" fill="#221f18"/>
    <text x="80" y="707" fill="#fbfaf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <rect x="104" y="660" width="1032" height="104" rx="10" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
    <rect x="120" y="674" width="46" height="20" rx="5" fill="#6a4a94"/>
    <text x="143" y="688" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" text-anchor="middle">TOOL</text>
    <text x="180" y="688" fill="#4b4433" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">mcp__github__create_pr: OK, schema attached, callable next turn</text>
    <rect x="120" y="706" width="52" height="20" rx="5" fill="#9c7a1a"/>
    <text x="146" y="720" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" text-anchor="middle">USER</text>
    <text x="188" y="720" fill="#4b4433" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">&lt;system-reminder&gt; Tool iterations remaining: 19/20</text>
    <text x="188" y="742" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-style="italic">new message, so no ephemeral note here, that only ever rides message #2</text>
  </g>

  <!-- Row 5: assistant, calls the newly-activated tool -->
  <g>
    <circle cx="80" cy="806" r="14" fill="#221f18"/>
    <text x="80" y="811" fill="#fbfaf6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">5</text>
    <rect x="104" y="786" width="1032" height="64" rx="10" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
    <rect x="120" y="800" width="90" height="20" rx="5" fill="#3d7a56"/>
    <text x="165" y="814" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" text-anchor="middle">ASSISTANT</text>
    <text x="222" y="815" fill="#4b4433" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">tool_use: mcp__github__create_pr({ branch: "auth-jwt", ... })</text>
    <text x="222" y="836" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-style="italic">callable directly now, its full schema rode the wire from turn 4 onward</text>
  </g>

  <text x="64" y="906" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">Loop continues until the model ends the turn, or the wrap-up zone (last turns before</text>
  <text x="64" y="926" fill="#7a715c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">maxIterations</text>
  <text x="188" y="926" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">) forces tools[] to [] on the wire so the model finalizes from what it already has.</text>
</svg>
