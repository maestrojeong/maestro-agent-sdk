<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">How one wire request is composed</title>
  <desc id="desc">The system prompt and tool list ride every call unchanged. Ephemeral instructions carry the deferred-tool catalog once per invocation without touching saved history. The per-turn reminder carries only the iteration budget and is frozen into history every turn.</desc>

  <rect width="1200" height="700" rx="20" fill="#fbfaf6"/>
  <rect x="1" y="1" width="1198" height="698" rx="19" fill="none" stroke="#ded2b0" stroke-width="2"/>

  <text x="64" y="64" fill="#b4790a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">UNDER THE HOOD</text>
  <text x="64" y="98" fill="#221f18" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="750">How one wire request is composed</text>
  <rect x="64" y="114" width="46" height="3" fill="#b4790a"/>
  <text x="64" y="146" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">v0.3.0: session id and built-in Task tools are removed. The deferred-tool catalog moved off</text>
  <text x="64" y="166" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">the per-turn reminder onto the ephemeral path.</text>

  <!-- 4 cards -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="64" y="196" width="256" height="150" rx="10" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
    <text x="84" y="228" fill="#221f18" font-size="15" font-weight="700">system prompt</text>
    <text x="84" y="254" fill="#7a715c" font-size="12.5">Persona and image-handling</text>
    <text x="84" y="272" fill="#7a715c" font-size="12.5">note, joined once. Identical</text>
    <text x="84" y="290" fill="#7a715c" font-size="12.5">on every call.</text>

    <rect x="336" y="196" width="256" height="150" rx="10" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
    <text x="356" y="228" fill="#221f18" font-size="15" font-weight="700">ephemeral instructions</text>
    <rect x="356" y="238" width="98" height="20" rx="5" fill="#dbe9e1"/>
    <text x="405" y="252" fill="#2b6b4f" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing=".3">NOT PERSISTED</text>
    <text x="356" y="278" fill="#7a715c" font-size="12.5">Snapshotted once per invo-</text>
    <text x="356" y="296" fill="#7a715c" font-size="12.5">cation. Carries the deferred-</text>
    <text x="356" y="314" fill="#7a715c" font-size="12.5">tool note and host instructions.</text>

    <rect x="608" y="196" width="256" height="150" rx="10" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
    <text x="628" y="228" fill="#221f18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">&lt;system-reminder&gt;</text>
    <rect x="628" y="238" width="82" height="20" rx="5" fill="#f4e6c8"/>
    <text x="669" y="252" fill="#8a5a0a" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing=".3">CANONICAL</text>
    <text x="628" y="278" fill="#7a715c" font-size="12.5">Iteration budget and wrap-up</text>
    <text x="628" y="296" fill="#7a715c" font-size="12.5">overlay only. Frozen fresh into</text>
    <text x="628" y="314" fill="#7a715c" font-size="12.5">history every turn.</text>

    <rect x="880" y="196" width="256" height="150" rx="10" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
    <text x="900" y="228" fill="#221f18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">tools[]</text>
    <rect x="955" y="215" width="82" height="20" rx="5" fill="#e8e2f4"/>
    <text x="996" y="229" fill="#5b4a94" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing=".3">WIRE FIELD</text>
    <text x="900" y="254" fill="#7a715c" font-size="12.5">Active builtins plus promoted</text>
    <text x="900" y="272" fill="#7a715c" font-size="12.5">deferred tools. Emptied in the</text>
    <text x="900" y="290" fill="#7a715c" font-size="12.5">wrap-up zone.</text>
  </g>

  <path d="M 600 366 L 600 384" fill="none" stroke="#7a715c" stroke-width="1.5"/>
  <path d="M 592 378 L 600 390 L 608 378 Z" fill="#7a715c"/>

  <!-- wire box -->
  <rect x="64" y="404" width="1072" height="256" rx="12" fill="#fffdf7" stroke="#b4790a" stroke-width="2"/>
  <text x="88" y="436" fill="#b4790a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1">BODY.MESSAGES</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
    <rect x="88" y="452" width="86" height="22" rx="5" fill="#3d5a80"/>
    <text x="131" y="467" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">SYSTEM</text>
    <text x="188" y="467" fill="#4b4433">augmentedSystemPrompt</text>
    <text x="1124" y="467" fill="#7a715c" font-style="italic" font-size="11.5" text-anchor="end">unchanged every call</text>
    <line x1="88" y1="482" x2="1124" y2="482" stroke="#e6ddc4" stroke-width="1" stroke-dasharray="2,3"/>

    <rect x="88" y="494" width="86" height="22" rx="5" fill="#9c7a1a"/>
    <text x="131" y="509" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">USER</text>
    <text x="188" y="509" fill="#4b4433">prompt + reminder(turn 1)</text>
    <text x="1124" y="509" fill="#7a715c" font-style="italic" font-size="11.5" text-anchor="end">plus ephemeral note, this invocation's anchor only</text>
    <line x1="88" y1="524" x2="1124" y2="524" stroke="#e6ddc4" stroke-width="1" stroke-dasharray="2,3"/>

    <rect x="88" y="536" width="86" height="22" rx="5" fill="#3d7a56"/>
    <text x="131" y="551" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">ASSISTANT</text>
    <text x="188" y="551" fill="#4b4433">text + tool_calls[]</text>
    <line x1="88" y1="566" x2="1124" y2="566" stroke="#e6ddc4" stroke-width="1" stroke-dasharray="2,3"/>

    <rect x="88" y="578" width="86" height="22" rx="5" fill="#6a4a94"/>
    <text x="131" y="593" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">TOOL</text>
    <text x="188" y="593" fill="#4b4433">tool_call_id, result</text>
    <text x="1124" y="593" fill="#7a715c" font-style="italic" font-size="11.5" text-anchor="end">one message per tool_result block</text>
    <line x1="88" y1="608" x2="1124" y2="608" stroke="#e6ddc4" stroke-width="1" stroke-dasharray="2,3"/>

    <rect x="88" y="620" width="86" height="22" rx="5" fill="#9c7a1a"/>
    <text x="131" y="635" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">USER</text>
    <text x="188" y="635" fill="#4b4433">reminder(turn 2): iteration budget only</text>
  </g>
</svg>
