<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to run agent code</title>
  <desc id="desc">Comparison of a CLI wrapper SDK, a standalone agent product, and the Maestro Agent SDK, showing what owns the harness underneath your application in each case.</desc>

  <rect width="1200" height="500" rx="20" fill="#fbfaf6"/>
  <rect x="1" y="1" width="1198" height="498" rx="19" fill="none" stroke="#ded2b0" stroke-width="2"/>

  <text x="64" y="64" fill="#b4790a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">POSITIONING</text>
  <text x="64" y="98" fill="#221f18" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="750">Three ways to run agent code</text>
  <rect x="64" y="114" width="46" height="3" fill="#b4790a"/>
  <text x="64" y="146" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15.5">The difference is what owns the harness underneath your application: another product's, or yours.</text>

  <!-- CLI wrapper SDK -->
  <rect x="64" y="176" width="344" height="300" rx="12" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
  <text x="90" y="212" fill="#221f18" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16.5" font-weight="700">CLI wrapper SDK</text>
  <rect x="90" y="230" width="292" height="40" rx="8" fill="#f4e6c8" stroke="#d9c08a"/>
  <text x="236" y="255" fill="#4b4433" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14.5" font-weight="650" text-anchor="middle">Your application</text>
  <text x="236" y="285" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle">↓</text>
  <rect x="90" y="296" width="292" height="40" rx="8" fill="#f4f1e6" stroke="#ded2b0"/>
  <text x="236" y="321" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14.5" text-anchor="middle">SDK wrapper</text>
  <text x="236" y="351" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle">↓</text>
  <rect x="90" y="362" width="292" height="40" rx="8" fill="#f4f1e6" stroke="#ded2b0"/>
  <text x="236" y="387" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14.5" text-anchor="middle">CLI subprocess and harness</text>
  <line x1="90" y1="424" x2="382" y2="424" stroke="#ded2b0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="90" y="448" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">The product's runtime stays underneath, opaque.</text>

  <!-- Standalone agent product -->
  <rect x="428" y="176" width="344" height="300" rx="12" fill="#ffffff" stroke="#ded2b0" stroke-width="1.5"/>
  <text x="454" y="212" fill="#221f18" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16.5" font-weight="700">Standalone agent product</text>
  <rect x="454" y="230" width="292" height="40" rx="8" fill="#f4e6c8" stroke="#d9c08a"/>
  <text x="600" y="255" fill="#4b4433" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14.5" font-weight="650" text-anchor="middle">Your application</text>
  <text x="600" y="285" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle">↓</text>
  <rect x="454" y="296" width="292" height="40" rx="8" fill="#f4f1e6" stroke="#ded2b0"/>
  <text x="600" y="321" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14.5" text-anchor="middle">Agent product (UI, harness, workflow)</text>
  <line x1="454" y1="424" x2="746" y2="424" stroke="#ded2b0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="454" y="448" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">You adopt the product's operating model whole.</text>

  <!-- Maestro Agent SDK -->
  <rect x="792" y="176" width="344" height="300" rx="12" fill="#fffdf7" stroke="#b4790a" stroke-width="2"/>
  <text x="818" y="212" fill="#221f18" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16.5" font-weight="700">Maestro Agent SDK</text>
  <rect x="818" y="230" width="292" height="40" rx="8" fill="#f4e6c8" stroke="#b4790a"/>
  <text x="964" y="255" fill="#4b4433" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14.5" font-weight="650" text-anchor="middle">Your application</text>
  <text x="964" y="285" fill="#8a5a0a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" text-anchor="middle">↓</text>
  <rect x="818" y="296" width="292" height="40" rx="8" fill="#f4e6c8" stroke="#b4790a"/>
  <text x="964" y="320" fill="#4b4433" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="650" text-anchor="middle">harness engine (loop, tools,</text>
  <text x="964" y="334" fill="#4b4433" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="650" text-anchor="middle">MCP, compaction)</text>
  <line x1="818" y1="424" x2="1110" y2="424" stroke="#e6cf8f" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="818" y="448" fill="#221f18" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Your host owns the product.</text>
  <text x="818" y="465" fill="#7a715c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">The engine is a library call, not a layer.</text>
</svg>
