name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }} / typecheck + build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Glob/Grep shell out to ripgrep (see src/tools/builtin/glob.ts,
      # src/tools/builtin/grep.ts) — ubuntu-latest runners don't ship it
      # by default, unlike most local dev machines (Homebrew/apt already
      # have it), so tests would otherwise fail with ENOENT here only.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (tsc + tsc-alias)
        run: npm run build

      - name: Run tests
        run: npm test
